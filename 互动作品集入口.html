<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="互动作品集入口页">
  <title>互动作品集</title>
  <style>
    :root {
      --bg-1: #090d12;
      --bg-2: #141b22;
      --panel: rgba(15, 20, 24, 0.68);
      --line: rgba(255, 255, 255, 0.12);
      --text: #eef2f4;
      --muted: rgba(238, 242, 244, 0.72);
      --neon: #7ef7ff;
      --hot: #ff6a5c;
      --violet: #9e8cff;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100vh;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      background: var(--bg-1);
      color: var(--text);
    }

    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      position: relative;
      letter-spacing: 0.02em;
    }

    body::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(180deg, rgba(7, 11, 15, 0.38), rgba(7, 11, 15, 0.7)),
        url('assets/scene-background.svg');
      background-size: cover;
      background-position: center;
      filter: saturate(1.3) contrast(1.08) brightness(0.78);
      transform: scale(1.08);
    }

    body::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        repeating-linear-gradient(
          180deg,
          rgba(255,255,255,0.04),
          rgba(255,255,255,0.04) 1px,
          transparent 1px,
          transparent 4px
        );
      mix-blend-mode: screen;
      opacity: 0.2;
      pointer-events: none;
    }

    .ambient {
      position: absolute;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 18% 18%, rgba(126, 247, 255, 0.28), transparent 22%),
        radial-gradient(circle at 82% 24%, rgba(255, 106, 92, 0.22), transparent 18%),
        radial-gradient(circle at 50% 100%, rgba(158, 140, 255, 0.18), transparent 26%);
      filter: blur(12px);
    }

    .card {
      position: relative;
      z-index: 1;
      width: min(660px, calc(100% - 36px));
      padding: 52px 44px 38px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(12px);
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.38),
        inset 0 0 0 1px rgba(255,255,255,0.04),
        0 0 32px rgba(126, 247, 255, 0.08);
      text-align: left;
      transform: perspective(1200px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
      transition: transform 0.18s ease-out, box-shadow 0.3s ease;
      will-change: transform;
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(circle at var(--pointer-x, 50%) var(--pointer-y, 50%), rgba(126, 247, 255, 0.16), transparent 34%);
      opacity: 0.8;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 14px;
      border: 1px solid rgba(126, 247, 255, 0.5);
      background: rgba(126, 247, 255, 0.08);
      color: var(--neon);
      font-size: 11px;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      margin-bottom: 26px;
    }

    .brand::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--neon);
      box-shadow: 0 0 12px var(--neon);
    }

    h1 {
      margin: 0;
      font-size: clamp(42px, 6vw, 88px);
      line-height: 0.9;
      letter-spacing: -0.06em;
      font-weight: 800;
      color: var(--text);
      text-shadow: 0 0 18px rgba(126, 247, 255, 0.18);
    }

    .subtitle {
      margin: 18px 0 28px;
      max-width: 480px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.9;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-top: 24px;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 190px;
      padding: 16px 24px;
      border: 1px solid transparent;
      text-decoration: none;
      color: #081117;
      background: linear-gradient(135deg, var(--neon), #e2fbff);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      box-shadow: 0 0 20px rgba(126, 247, 255, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 24px rgba(126, 247, 255, 0.56);
    }

    .ghost {
      color: var(--text);
      background: transparent;
      border-color: rgba(255,255,255,0.18);
      box-shadow: none;
    }

    .ghost:hover {
      border-color: rgba(255, 106, 92, 0.7);
      box-shadow: 0 0 18px rgba(255, 106, 92, 0.22);
    }

    .meta {
      margin-top: 34px;
      display: flex;
      align-items: center;
      gap: 14px;
      color: rgba(238,242,244,0.66);
      font-size: 11px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .meta::before {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, rgba(126, 247, 255, 0.7), rgba(255,255,255,0.08));
    }

    .signal-readout {
      position: fixed;
      right: 24px;
      bottom: 20px;
      z-index: 2;
      color: rgba(238,242,244,0.58);
      font: 10px 'DM Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .about-dialog {
      width: min(480px, calc(100% - 36px));
      padding: 30px;
      border: 1px solid rgba(126, 247, 255, 0.35);
      color: var(--text);
      background: rgba(9, 13, 18, 0.94);
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 30px rgba(126, 247, 255, 0.12);
    }

    .about-dialog::backdrop {
      background: rgba(4, 7, 10, 0.72);
      backdrop-filter: blur(8px);
    }

    .about-dialog h2 { margin: 0 0 14px; font-size: 28px; letter-spacing: -.05em; }
    .about-dialog p { margin: 0 0 22px; color: var(--muted); line-height: 1.8; font-size: 13px; }
    .dialog-close { color: var(--text); background: transparent; border: 1px solid var(--line); cursor: pointer; padding: 10px 14px; }
    .dialog-close:hover { border-color: var(--hot); color: var(--hot); }

    @media (prefers-reduced-motion: reduce) {
      .card { transform: none; transition: none; }
      .button { transition: none; }
    }

    @media (max-width: 640px) {
      .card {
        padding: 36px 24px 28px;
      }

      .actions {
        flex-direction: column;
        align-items: stretch;
      }

      .button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="ambient"></div>

  <main class="card">
    <div class="brand">Flow / Signal</div>
    <h1>INTERACTIVE<br>PORTFOLIO</h1>
    <p class="subtitle">
      探索创意、情感与技术之间的流动空间。这里是关于故事、视觉与互动的集合地。
    </p>

    <div class="actions">
      <a class="button" href="交流聚集地.html">进入作品展示</a>
      <button class="button ghost" type="button" data-about-trigger>关于项目</button>
    </div>

    <div class="meta">2026 / creative interface</div>
  </main>

  <div class="signal-readout" aria-live="polite">SIGNAL / READY</div>
  <dialog class="about-dialog" data-about-dialog>
    <h2>关于这个入口</h2>
    <p>这是一个把故事、视觉与互动放在同一条信号链上的作品集入口。移动指针，观察界面如何回应；准备好后进入作品展示。</p>
    <button class="dialog-close" type="button" data-about-close>返回入口</button>
  </dialog>

  <script src="js/entry.js"></script>
</body>
</html>
